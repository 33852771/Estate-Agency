<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Agency</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body and general styling */
body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    color: #333;
    background-color: #f4f4f4;
}

/* Header */
header {
    background: #333;
    color: white;
    padding: 10px 0;
}

nav ul {
    list-style: none;
    text-align: center;
}

nav ul li {
    display: inline;
    margin: 0 15px;
}

nav ul li a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav ul li a:hover {
    text-decoration: underline;
}

/* Section styles */
section {
    padding: 20px;
    margin: 20px auto;
    max-width: 800px;
    background-color: white;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

h1, h2 {
    color: #333;
}

button {
    background-color: #007BFF;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
}

button:hover {
    background-color: #0056b3;
}

/* Input and form styling */
form {
    display: flex;
    flex-direction: column;
}

label {
    margin-top: 10px;
    font-weight: bold;
}

input[type="text"], input[type="number"], input[type="email"], textarea {
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

textarea {
    height: 100px;
}

/* Mortgage Calculator result */
#result {
    margin-top: 20px;
    font-size: 1.2rem;
    color: #333;
}
.cta-button {
    display: inline-block;
    background-color: #007BFF;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 5px;
    font-size: 1rem;
}

.cta-button:hover {
    background-color: #0056b3;
}
@media (max-width: 768px) {
    section {
        margin: 10px;
        padding: 15px;
    }

    h1, h2 {
        font-size: 1.5rem;
    }

    input, textarea, button {
        font-size: 1rem;
        width: 100%;
    }

    .cta-button {
        font-size: 1rem;
        padding: 10px;
        width: 100%;
        text-align: center;
    }

    nav ul {
        flex-direction: column;
        align-items: center;
    }

    nav ul li {
        margin: 5px 0;
    }
}
</style>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#mortgage">Mortgage Calculator</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Homepage -->
    <section id="home">
        <h1>Welcome to Our Real Estate Agency</h1>
        <p>Your dream home is just a click away!</p>
        <a href="#mortgage" class="cta-button">Calculate Mortgage</a>
    </section>

    <!-- Mortgage Calculator -->
    <section id="mortgage">
        <h2>Mortgage Calculator</h2>
        <form id="mortgageForm">
            <label for="loanAmount">Loan Amount ($):</label>
            <input type="number" id="loanAmount" required>

            <label for="interestRate">Interest Rate (%):</label>
            <input type="number" id="interestRate" required>

            <label for="loanTerm">Loan Term (Years):</label>
            <input type="number" id="loanTerm" required>

            <button type="button" onclick="calculateMortgage()">Calculate</button>
        </form>
        <div id="result">
            <p>Monthly Payment: $<span id="monthlyPayment">0.00</span></p>
        </div>
    </section>

    <!-- Property Viewing Request -->
    <section id="contact">
        <h2>Property Viewing Request</h2>
        <form action="mailto:youremail@example.com" method="post" enctype="text/plain">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="property">Property Address:</label>
            <input type="text" id="property" name="property" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Submit Request</button>
        </form>
    </section>

    <script src="scripts.js">
        function calculateMortgage() {
    const loanAmount = parseFloat(document.getElementById('loanAmount').value);
    const interestRate = parseFloat(document.getElementById('interestRate').value) / 100 / 12;
    const loanTerm = parseInt(document.getElementById('loanTerm').value) * 12;

    if (isNaN(loanAmount) || isNaN(interestRate) || isNaN(loanTerm) || loanAmount <= 0 || interestRate <= 0 || loanTerm <= 0) {
        alert("Please fill out all fields with valid numbers.");
        return;
    }

    const x = Math.pow(1 + interestRate, loanTerm);
    const monthlyPayment = (loanAmount * interestRate * x) / (x - 1);

    document.getElementById('monthlyPayment').innerText = monthlyPayment.toFixed(2);
}

    </script>
</body>
</html>
